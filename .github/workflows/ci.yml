name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 手动触发：平台丢事件或需重跑时的手动入口
  workflow_dispatch:

jobs:
  # 验收步骤清单的唯一真源是 scripts/verify.mjs：两个 job 都只调用它，不在 CI 里另写一份步骤，避免清单漂移
  check:
    runs-on: ubuntu-latest
    steps:
      # 完整克隆：docs:build 的 lastUpdated 依赖 git 提交时间，浅克隆会失真
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: 门禁校验（全量）
        run: pnpm verify
      # 运行时回归 job 复用本 job 的构建产物，避免在 node18 上跑 tsup（其 engines 要求更高）
      - uses: actions/upload-artifact@v4
        with:
          name: dist-node20
          path: dist
          retention-days: 1

  # 运行时下限回归：验证发布产物与 CLI 在 node18 上可用，步骤仍由 scripts/verify.mjs 定义
  runtime-node18:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.4
      - uses: actions/setup-node@v5
        with:
          # 钉住声明下限，避免后续 .node-version 升级时该 job 静默漂移
          node-version: 18.12.0
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          name: dist-node20
          path: dist
      - name: 运行时回归（node18）
        run: pnpm verify --runtime-only
        env:
          EXPECTED_NODE: 18.12.0

  # Windows × node18 组合：平台差异与运行时下限交叉覆盖
  windows-runtime18:
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.4
      - uses: actions/setup-node@v5
        with:
          node-version: 18.12.0
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          name: dist-node20
          path: dist
      - name: 运行时回归（Windows × node18）
        run: pnpm verify --runtime-only
        env:
          EXPECTED_NODE: 18.12.0

  # Windows 回归：类型检查 / 静态检查 / 构建与主平台并行，避免跨平台路径与换行问题漏网
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: 门禁校验（Windows 裁剪）
        run: pnpm verify --skip-docs

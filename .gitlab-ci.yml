# GitLab CI：完整检查（test）+ 文档站构建部署（pages，origin 自建 GitLab 实例）。
# test 的验收步骤清单唯一真源是 scripts/verify.mjs，此处只调用，不在 CI 里另写一份步骤，避免清单漂移。
# 作业镜像由 ci-templates 依据 .ci/toolchain.json 动态构建，仓库内不再安装 Node 与 pnpm。
# 分支口径统一用 $CI_DEFAULT_BRANCH，不写死分支名；两类 job 各写一份 rules。
# 站点路径为项目页子路径 /swagger2api/，与 config.mts 默认 base 一致，无需注入 VITEPRESS_BASE。
include:
  - project: fxri/develop/0001.base/ci-templates
    ref: main
    file: /dynamic-image.yml

# 全部作业只在默认分支执行，工具链作业随之收敛，避免分支推送反复触发镜像构建
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

stages:
  - test
  - deploy

test:
  # 与 .node-version 对齐，避免与 GitHub Actions 两侧 node 版本漂移
  image:
    name: $CI_IMAGE
    pull_policy: if-not-present
  stage: test
  needs:
    - toolchain:spec
    - toolchain:ensure
  script:
    - pnpm verify
  # 构建产物供 node18 运行时作业复用
  artifacts:
    paths:
      - dist
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# 运行时下限回归：镜像基于 .ci/toolchain.json（node20），作业内下载便携版 node18 执行运行时步骤
runtime18:
  image:
    name: $CI_IMAGE
    pull_policy: if-not-present
  stage: test
  needs:
    - toolchain:spec
    - toolchain:ensure
    - job: test
      artifacts: true
  script:
    # 镜像基于 Debian slim：自带 tar 与 gzip，故使用官方 tar.gz；按架构选包、双源回退并校验完整性
    # tarball 缓存到项目内 .cache/nodejs（GitLab cache 跨流水线保留），命中时省去重复下载，校验始终执行
    - |
      set -euo pipefail
      case "$(uname -m)" in
        x86_64) NODE_ARCH=x64 ;;
        aarch64|arm64) NODE_ARCH=arm64 ;;
        *) echo "不支持的架构：$(uname -m)"; exit 1 ;;
      esac
      NODE_VERSION=18.12.0
      NODE_TARBALL="node-v${NODE_VERSION}-linux-${NODE_ARCH}.tar.gz"
      NODE_CACHE="$CI_PROJECT_DIR/.cache/nodejs"
      mkdir -p "$NODE_CACHE"
      if [ ! -f "$NODE_CACHE/$NODE_TARBALL" ] || [ ! -f "$NODE_CACHE/SHASUMS256.txt" ]; then
        BASE="https://nodejs.org/dist/v${NODE_VERSION}"
        curl -fsSL "${BASE}/${NODE_TARBALL}" -o "$NODE_CACHE/${NODE_TARBALL}.tmp" || {
          BASE="https://npmmirror.com/mirrors/node/v${NODE_VERSION}"
          curl -fsSL "${BASE}/${NODE_TARBALL}" -o "$NODE_CACHE/${NODE_TARBALL}.tmp"
        }
        mv "$NODE_CACHE/${NODE_TARBALL}.tmp" "$NODE_CACHE/$NODE_TARBALL"
        curl -fsSL "${BASE}/SHASUMS256.txt" -o "$NODE_CACHE/SHASUMS256.txt"
      fi
      ( cd "$NODE_CACHE" && grep " ${NODE_TARBALL}$" SHASUMS256.txt | sha256sum -c - )
      tar -xzf "$NODE_CACHE/$NODE_TARBALL" -C /opt
      export PATH="/opt/node-v${NODE_VERSION}-linux-${NODE_ARCH}/bin:${PATH}"
      node -v
      EXPECTED_NODE=${NODE_VERSION} node scripts/verify.mjs --runtime-only
  # 缓存键不含版本与架构：文件名本身带版本 + 架构，版本升级时按缺失重新下载，避免多份残留
  cache:
    key: node18-tarball-linux
    paths:
      - .cache/nodejs
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

pages:
  image:
    name: $CI_IMAGE
    pull_policy: if-not-present
  stage: deploy
  needs:
    - toolchain:spec
    - toolchain:ensure
  script:
    - pnpm install --frozen-lockfile
    # 镜像由 AI 在开发过程中生成并随提交入库，流水线只构建；GitLab Pages 规定产物必须位于 public/
    - pnpm docs:build
    - rm -rf public && mv docs/.vitepress/dist public
  artifacts:
    paths:
      - public
  # 默认分支每次推送都重建：站点输入不止 docs/（根 CHANGELOG.md 由脚本同步进 docs/、依赖清单决定
  # 构建工具版本、站点配置与导航产物同属输入），枚举路径必然漏项，故不设 changes 约束
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

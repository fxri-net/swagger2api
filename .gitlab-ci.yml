# GitLab CI：完整检查（test）+ 文档站构建部署（pages，origin 自建 GitLab 实例）。
# test 的验收步骤清单唯一真源是 scripts/verify.mjs，此处只调用，不在 CI 里另写一份步骤，避免清单漂移。
# 作业镜像由 ci-templates 依据 .ci/toolchain.json 动态构建，仓库内不再安装 Node 与 pnpm。
# 分支口径统一用 $CI_DEFAULT_BRANCH，不写死分支名；两类 job 各写一份 rules。
# 站点路径为项目页子路径 /swagger2api/，与 config.mts 默认 base 一致，无需注入 VITEPRESS_BASE。
include:
  - project: fxri/develop/0001.base/ci-templates
    ref: main
    file: /dynamic-image.yml

# 全部作业只在默认分支执行，工具链作业随之收敛，避免分支推送反复触发镜像构建
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

stages:
  - test
  - deploy

test:
  # 与 .node-version 对齐，避免与 GitHub Actions 两侧 node 版本漂移
  image: $CI_IMAGE
  stage: test
  needs:
    - toolchain:spec
    - toolchain:ensure
  script:
    - pnpm verify
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

pages:
  image: $CI_IMAGE
  stage: deploy
  needs:
    - toolchain:spec
    - toolchain:ensure
  script:
    - pnpm install --frozen-lockfile
    # 同步更新日志进文档站后构建，GitLab Pages 规定产物必须位于 public/
    - node scripts/sync-changelog-doc.mjs
    - pnpm docs:build
    - rm -rf public && mv docs/.vitepress/dist public
  artifacts:
    paths:
      - public
  rules:
    # CHANGELOG.md 会改变更新日志页内容，必须一并纳入触发路径
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - docs/**/*
        - scripts/sync-changelog-doc.mjs
        - CHANGELOG.md
        - .gitlab-ci.yml
        - package.json
        - pnpm-lock.yaml
